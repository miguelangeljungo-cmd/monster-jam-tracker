button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

.topbar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px;position:sticky;top:0;background:linear-gradient(var(--bg) 80%,transparent);z-index:5}
.topbar h1{flex:1;margin:0;text-align:center;font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);flex:none}
.iconbtn svg{width:20px;height:20px}
.pillbtn{background:var(--y);color:#111;font-weight:800;border-radius:10px;padding:7px 14px;font-size:14px}
.hero{position:relative;margin:0 -14px;padding:calc(24px + env(safe-area-inset-top,0px)) 14px 22px;background:radial-gradient(ellipse at 50% 0%,#3a3020 0,#141417 60%,var(--bg) 100%);text-align:center;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 40px,rgba(255,201,40,.04) 40px 42px)}
.hero .iconbtn{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top,0px))}
.wordmark{position:relative;display:inline-block;padding:14px 26px 12px;transform:skew(-8deg);background:linear-gradient(#ffd84d,#f2a900);clip-path:polygon(0 0,100% 0,92% 100%,8% 100%);}
.wordmark span{display:block;font-weight:900;font-style:italic;letter-spacing:1px;line-height:.9;color:#fff;-webkit-text-stroke:2px #111;text-shadow:3px 3px 0 #111;font-size:40px}
.wordmark span+span{font-size:46px}
.wordmark{background:#111;border:4px solid var(--y);clip-path:none;border-radius:6px 6px 26px 26px}
.sub{position:relative;margin-top:8px;color:var(--y);font-weight:800;letter-spacing:3px;font-size:11px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr 1.1fr;gap:8px;margin:14px 0}
.tile{background:var(--card);border-radius:14px;padding:12px 6px;text-align:center;border:1px solid var(--line)}
.tile b{display:block;font-size:24px;font-weight:900}
.tile small{color:var(--muted);font-size:12px}
.tile.g{border-color:#1f5f30;background:#13261a}.tile.g b{color:var(--g)}
.tile.bl{border-color:#1c3f66;background:#121e2c}.tile.bl b{color:var(--b)}
.ring{display:grid;place-items:center;position:relative}.ring svg{width:70px;height:70px}
.ring div{position:absolute;text-align:center;line-height:1}.ring div b{font-size:16px}.ring div small{font-size:9px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;margin:10px 0}
.search input{flex:1;background:none;border:0;outline:0;padding:12px 0;font-size:16px}
.search svg{width:18px;height:18px;color:var(--muted)}
.pills{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none}.pills::-webkit-scrollbar,.hrow::-webkit-scrollbar{display:none}
.pill{flex:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 13px;font-size:14px;font-weight:600;white-space:nowrap}
.pill.on{background:var(--y);color:#111;border-color:var(--y);font-weight:800}
select.pill{appearance:none;-webkit-appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat;max-width:150px;width:auto;flex:none}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.cat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.cat .ph{height:52px;margin-bottom:6px;border-radius:10px;overflow:hidden}.cat .ph svg{width:100%;height:100%;display:block}.cat b{display:block;font-size:14px;font-weight:800}.cat small{color:var(--muted);font-size:11px}
.cat.on{border-color:var(--y);box-shadow:0 0 0 1px var(--y) inset}
.sect{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px}
.sect h2{margin:0;font-size:20px;font-weight:900}.sect a{color:var(--y);font-weight:700;text-decoration:none;font-size:14px}
.hrow{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;scrollbar-width:none}
.scard{flex:none;width:148px;scroll-snap-align:start;background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line);text-decoration:none;color:inherit;display:block}
.scard .img{height:86px;background:var(--card2)}.scard .bd{padding:8px 10px 10px}
.scard b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.scard small{color:var(--muted);font-size:12px}
.bar{height:6px;border-radius:4px;background:#33363c;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--g);border-radius:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcard{position:relative;background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line);display:block;text-decoration:none;color:inherit}
.tcard .img{aspect-ratio:4/3;background:var(--card2)}
.tcard .nm{padding:7px 9px 9px}.tcard .nm b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tcard .nm small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard.own{border-color:#245c33}

.chk svg{width:14px;height:14px;color:#fff}
.heart{position:absolute;right:5px;top:5px;width:32px;height:32px;display:grid;place-items:center}
.heart svg{width:22px;height:22px;filter:drop-shadow(0 1px 2px #000a)}
.qty{position:absolute;left:36px;top:9px;background:#000a;border-radius:8px;padding:1px 6px;font-size:11px;font-weight:800}
.img img,.img svg.truck{width:100%;height:100%;object-fit:cover;display:block}
.banner{position:relative;border-radius:16px;overflow:hidden;height:150px;margin-bottom:10px;background:radial-gradient(ellipse at 50% 120%,#5a3a10,#16161a 70%);display:grid;place-items:center;text-align:center;border:1px solid var(--line)}
.banner .bt{font-weight:900;font-style:italic;font-size:38px;line-height:1;color:var(--y);-webkit-text-stroke:1.5px #000;text-shadow:3px 3px 0 #000,0 0 18px #ff9d0066;text-transform:uppercase;padding:0 10px}
.banner small{display:block;color:#fff;font-weight:800;letter-spacing:3px;margin-top:6px;font-size:11px}

.banner .ghost{position:absolute;bottom:-14px;width:120px;opacity:.35}

.form label{display:block;color:var(--muted);font-size:13px;margin:12px 0 4px}.form .inp{width:100%;text-align:left}
.list a,.list button.li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line);text-decoration:none;color:inherit;width:100%;text-align:left}
.list>*:first-child{border-top:0!important}
.list .th{width:58px;height:44px;border-radius:8px;overflow:hidden;flex:none;background:var(--card2)}
.list .tx{flex:1;min-width:0}.list .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list .tx small{color:var(--muted)}
.list .ct{color:var(--muted);font-size:13px;font-weight:700;text-align:right;min-width:60px}
.yearh{font-size:15px;font-weight:900;color:var(--y);margin:18px 2px 6px}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
.count{color:var(--muted);font-size:13px;margin:6px 2px 10px}
.more{display:block;margin:14px auto;padding:12px 30px}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(14,14,17,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:var(--safe-b);z-index:20}

.tabbar a svg{width:24px;height:24px}.tabbar a.on{color:var(--y)}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);background:#2b2d33;padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;z-index:30}.toast.on{opacity:1}

function seedEntry(x){return {id:x[0],name:x[1],year:x[2],type:x[3],series:x[4],variant:x[5],notes:x[6],owned:false,source:'Brian Z. Patton catalog'}}
function normK(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
let entries=JSON.parse(localStorage.getItem('smjm_entries')||'null');
const storedVer=+localStorage.getItem('smjm_catalog_version')||0;
if(!Array.isArray(entries)){entries=seed.map(seedEntry);localStorage.setItem('smjm_catalog_version',CATALOG_VERSION);localStorage.setItem('smjm_entries',JSON.stringify(entries));}
else if(storedVer<CATALOG_VERSION){
  const fresh=seed.map(seedEntry),byId=new Map(fresh.map(e=>[e.id,e]));const used=new Set();const extras=[];
  entries.forEach(old=>{
    let m=byId.get(old.id);
    if(!m&&/^seed-\d+$/.test(String(old.id))){ // legacy index-based id from v1 starter catalog
      const L=legacySeed[+String(old.id).slice(5)];const nm=normK(L?L[0]:old.name),yr=String(L?L[1]:old.year),tp=L?L[2]:old.type;
      const words=String((L?L[4]:old.variant)||'').toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>2);
      const cands=fresh.filter(f=>!used.has(f.id)&&normK(f.name)===nm&&f.year===yr);
      const score=f=>(f.type===tp?2:0)+words.filter(w=>(f.variant+' '+f.series).toLowerCase().includes(w)).length;
      cands.sort((p,q)=>score(q)-score(p));if(cands.length&&(score(cands[0])>=1||cands.length===1))m=cands[0];
    }
    if(m&&!used.has(m.id)){used.add(m.id);m.owned=!!old.owned||m.owned;if(old.notes&&!m.notes)m.notes=old.notes;USER_FIELDS.forEach(k=>{if(old[k]!==undefined)m[k]=old[k]})}
    else if(!/^sm-/.test(String(old.id))) extras.push(old); // custom or unmatched legacy entry: keep it
  });
  entries=fresh.concat(extras);localStorage.setItem('smjm_catalog_version',CATALOG_VERSION);localStorage.setItem('smjm_entries',JSON.stringify(entries));

 <div class="sect"><h2>About</h2></div><div class="panel note">Monster Jam 1:64 Collection Tracker — ${entries.length} entries (${v.length} visible), Spin Master releases 2019–2026. Your data lives only in this browser (localStorage; photos in IndexedDB). Add to Home Screen for an app-like, offline experience.<br><br>Catalog reference: <a href="https://brianzpatton.com/SpinMaster/index.html" target="_blank" rel="noopener">Brian Z. Patton Monster Truck Collection</a>. Not affiliated with Monster Jam, Feld Entertainment or Spin Master. Truck art is generated placeholders.</div>`;
}
// ===== Actions (delegated) =====
function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-fav],[data-act],[data-go],[data-seg],[data-mode],[data-tv],[data-az],[data-cown],[data-cfav],[data-ccat],[data-restore]');if(!t)return;
 const d=t.dataset;
 if(d.fav){ev.preventDefault();ev.stopPropagation();const e=byId.get(d.fav);e.favorite=!e.favorite;persist();const y=scrollY;route();scrollTo(0,y);toast(e.favorite?'Added to favorites':'Removed from favorites');return}
 if(d.go){if(d.own!==undefined||d.cat||d.favf)cstate={q:'',cat:d.cat||'',own:d.own||'',fav:!!d.favf,series:''};go(d.go);return}
 if(d.mode){homeMode=d.mode;localStorage.setItem('smjm_home_mode',homeMode);route();return}
 if(d.tv){tvTab=d.tv;route();return}
 if(d.az){const x=document.getElementById('az-'+d.az);if(x)scrollTo(0,x.getBoundingClientRect().top+scrollY-10);return}
 if(d.seg){segTab=d.seg;route();return}
 if(d.cown!==undefined){cstate.own=d.cown;route();return}
 if(d.cfav!==undefined){cstate.fav=!cstate.fav;route();return}
 if(d.ccat!==undefined){cstate.cat=d.ccat;route();return}
 if(d.restore){byId.get(d.restore).hidden=false;persist();route();toast('Restored');return}
 const id=decodeURIComponent((location.hash.split('/')[2])||'');const e=byId.get(id);
 switch(d.act){
  case 'back':if(navDepth>0)history.back();else location.replace('#/');break;
  case 'more':loadMore();break;
  case 'own':setOwned(e,!e.owned);persist();route();toast(e.owned?'Marked owned ✓':'Marked as needed');break;
  case 'wish':e.wishlist=!e.wishlist;persist();route();break;
  case 'ownall':{const s=seriesList().find(x=>x.key===d.key);const all=s.owned===s.items.length;if(confirm(all?'Unmark all trucks in this series?':'Mark all '+s.items.length+' trucks in this series as owned?')){s.items.forEach(x=>setOwned(x,!all));persist();route()}break}
  case 'rmphoto':if(confirm('Remove this photo?'))idbReq('readwrite',st=>st.delete(e.id)).then(()=>{photos.delete(e.id);route()});break;
  case 'del':{const x=byId.get(d.id);if(String(x.id).startsWith('sm-')){if(confirm('Hide this catalog entry? You can restore it from More.')){x.hidden=true;persist();go('#/more')}}else if(confirm('Delete "'+x.name+'" permanently?')){entries=entries.filter(y=>y!==x);persist();idbReq('readwrite',st=>st.delete(x.id)).catch(()=>{});photos.delete(x.id);go('#/collection')}break}
  case 'restoreall':entries.forEach(x=>x.hidden=false);persist();route();break;
  case 'export':download('spin-master-monster-jam-data.json',JSON.stringify({version:2,catalogVersion:CATALOG_VERSION,entries},null,2),'application/json');break;
  case 'csv':{let rows=[['Name','Year','Scale','Type','Series/Mix/Set','Variant/Extra','Notes','Owned','Quantity','Favorite','Wishlist','Price Paid','Owned Date','Hidden'],...entries.map(e=>[e.name,e.year,'1:64',e.type,e.series,e.variant,e.notes,e.owned?'Yes':'No',e.quantity,e.favorite?'Yes':'No',e.wishlist?'Yes':'No',e.pricePaid,e.ownedDate,e.hidden?'Yes':'No'])];download('spin-master-monster-jam-catalog.csv',rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv');break}
  case 'import':$('importFile').click();break;
  case 'packimp':pickPack();break;
  case 'packrm':if(confirm('Remove all '+packPhotos.size+' photo pack photos? Your own photos stay.'))removePack().then(n=>{toast('Removed '+n+' pack photos');route()});break;
  case 'reset':if(confirm('Unmark every entry as owned? The catalog, favorites and photos will remain.')){entries.forEach(x=>setOwned(x,false));persist();route()}break;
 }
});
$('importFile').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());let inc=Array.isArray(obj)?obj:obj.entries;if(!Array.isArray(inc))throw Error('File does not contain an entries list');if(confirm('Import '+inc.length+' entries? This replaces the current catalog and ownership list.')){entries=inc;localStorage.setItem('smjm_catalog_version',0);localStorage.setItem('smjm_entries',JSON.stringify(entries));location.reload()}}catch(err){alert('Could not import this file: '+err.message)}ev.target.value=''};
loadPhotos().finally(route);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
